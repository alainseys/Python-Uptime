<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status - {{ server.name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/update-status.css')}}">
</head>
<body>
    <div class="container">
        <h1>Update Status - {{ server.name }}</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in statuses %}
                        <option value="{{ status.name }}" {% if status.name == server.current_status %}selected{% endif %}>{{ status.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>
            <button type="submit">Update Status</button>
        </form>
        <a href="{{ url_for('admin') }}" class="back-link">Back to Admin Dashboard</a>
    </div>
</body>
</html>
